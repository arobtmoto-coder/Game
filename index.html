<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Ultimate 3D Drive</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hudLeft,
.hudRight{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.box{
    color:white;
    background:rgba(0,0,0,.65);
    border:1px solid rgba(255,255,255,.2);
    padding:8px 12px;
    border-radius:12px;
    backdrop-filter:blur(8px);
    font-size:14px;
}

#healthBar{
    width:100px;
    height:8px;
    background:#333;
    border-radius:10px;
    margin-top:5px;
    overflow:hidden;
}

#healthFill{
    width:100%;
    height:100%;
    background:#27d34d;
}

/* ================= NITRO ================= */

#nitroContainer{
    position:fixed;
    left:50%;
    bottom:118px;
    transform:translateX(-50%);
    width:180px;
    z-index:15;
}

#nitroText{
    text-align:center;
    color:white;
    font-weight:bold;
    font-size:13px;
    margin-bottom:4px;
    text-shadow:0 2px 4px black;
}

#nitroBar{
    width:100%;
    height:10px;
    background:rgba(0,0,0,.65);
    border-radius:10px;
    overflow:hidden;
    border:1px solid white;
}

#nitroFill{
    width:100%;
    height:100%;
    background:#20c9ff;
}

/* ================= CONTROLS ================= */

#controls{
    position:fixed;
    bottom:22px;
    left:0;
    right:0;
    z-index:20;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
}

.controlGroup{
    display:flex;
    gap:10px;
}

.btn{
    width:66px;
    height:66px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:26px;
    font-weight:bold;
    background:rgba(0,0,0,.6);
    border:2px solid rgba(255,255,255,.35);
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

.btn:active{
    transform:scale(.92);
    background:rgba(255,255,255,.25);
}

#nitroBtn{
    background:rgba(0,130,255,.65);
    font-size:17px;
}

/* ================= START / GAME OVER ================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.68);
}

.panel{
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:24px;
    text-align:center;
    color:white;
    background:rgba(15,18,25,.94);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.panel h1{
    font-size:32px;
    margin-bottom:12px;
}

.panel p{
    color:#bbb;
    line-height:1.5;
    margin-bottom:20px;
}

.mainButton{
    border:0;
    border-radius:30px;
    padding:14px 35px;
    color:white;
    background:#19c37d;
    font-size:17px;
    font-weight:bold;
}

#gameOver{
    display:none;
}

.stat{
    display:flex;
    justify-content:space-between;
    background:rgba(255,255,255,.07);
    padding:12px;
    margin:7px 0;
    border-radius:10px;
}

.hidden{
    display:none!important;
}

/* damage effect */

#damageFlash{
    position:fixed;
    inset:0;
    background:rgba(255,0,0,.35);
    z-index:50;
    pointer-events:none;
    opacity:0;
}
</style>
</head>

<body>

<div id="damageFlash"></div>

<div id="hud">

    <div class="hudLeft">

        <div class="box">
            🏁 <span id="distance">0</span> m
        </div>

        <div class="box">
            🪙 <span id="coins">0</span>
        </div>

        <div class="box">
            ❤️
            <div id="healthBar">
                <div id="healthFill"></div>
            </div>
        </div>

    </div>

    <div class="hudRight">

        <div class="box">
            🚗 <span id="speed">0</span> km/h
        </div>

    </div>

</div>

<div id="nitroContainer">

    <div id="nitroText">
        NITRO
    </div>

    <div id="nitroBar">
        <div id="nitroFill"></div>
    </div>

</div>


<div id="controls">

    <div class="controlGroup">

        <div class="btn" id="leftBtn">
            ◀
        </div>

        <div class="btn" id="rightBtn">
            ▶
        </div>

    </div>


    <div class="controlGroup">

        <div class="btn" id="brakeBtn">
            ▼
        </div>

        <div class="btn" id="gasBtn">
            ▲
        </div>

        <div class="btn" id="nitroBtn">
            N₂O
        </div>

    </div>

</div>


<!-- START -->

<div class="overlay" id="startScreen">

    <div class="panel">

        <h1>🚗 Ultimate Drive</h1>

        <p>
            Drive through the endless highway,
            avoid traffic, collect coins and
            use nitro to reach maximum speed.
        </p>

        <button class="mainButton" id="startButton">
            START DRIVE
        </button>

    </div>

</div>


<!-- GAME OVER -->

<div class="overlay" id="gameOver">

    <div class="panel">

        <h1>💥 GAME OVER</h1>

        <div class="stat">
            <span>Distance</span>
            <strong id="finalDistance">0 m</strong>
        </div>

        <div class="stat">
            <span>Coins</span>
            <strong id="finalCoins">0</strong>
        </div>

        <div class="stat">
            <span>Best Distance</span>
            <strong id="bestDistance">0 m</strong>
        </div>

        <br>

        <button class="mainButton" id="restartButton">
            DRIVE AGAIN
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

/* =========================================================
   GAME
========================================================= */

const canvas =
    document.createElement("canvas");

document.body.insertBefore(
    canvas,
    document.body.firstChild
);


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x7fc8ee);

scene.fog =
    new THREE.Fog(
        0x7fc8ee,
        70,
        260
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        .1,
        500
    );

camera.position.set(
    0,
    5.5,
    11
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        canvas:canvas,
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;


/* =========================================================
   LIGHT
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x446644,
        2
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    40,
    60,
    20
);

sun.castShadow = true;

scene.add(sun);


/* =========================================================
   GROUND
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            500,
            500
        ),
        new THREE.MeshStandardMaterial({
            color:0x3e8e42
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y =
    -.04;

scene.add(ground);


/* =========================================================
   ROAD
========================================================= */

const road =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            14,
            600
        ),
        new THREE.MeshStandardMaterial({
            color:0x292929,
            roughness:.9
        })
    );

road.rotation.x =
    -Math.PI / 2;

scene.add(road);


/* =========================================================
   ROAD EDGES
========================================================= */

function createRoadEdge(x){

    const edge =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .22,
                .06,
                600
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffff
            })
        );

    edge.position.set(
        x,
        .04,
        -150
    );

    scene.add(edge);
}

createRoadEdge(-6.7);
createRoadEdge(6.7);


/* =========================================================
   ROAD CENTER LINES
========================================================= */

const roadLines = [];

for(
    let i=0;
    i<80;
    i++
){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .22,
                .04,
                5
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffff
            })
        );

    line.position.set(
        0,
        .05,
        -i * 10
    );

    scene.add(line);

    roadLines.push(line);
}


/* =========================================================
   PLAYER CAR
========================================================= */

const player =
    new THREE.Group();

player.position.set(
    0,
    0,
    5
);

scene.add(player);


/* body */

const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.25,
            .65,
            4
        ),
        new THREE.MeshStandardMaterial({
            color:0xd71920,
            metalness:.45,
            roughness:.28
        })
    );

body.position.y =
    .72;

body.castShadow = true;

player.add(body);


/* hood */

const hood =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.1,
            .18,
            1.3
        ),
        new THREE.MeshStandardMaterial({
            color:0xee2028,
            metalness:.4
        })
    );

hood.position.set(
    0,
    1.02,
    1.15
);

player.add(hood);


/* cabin */

const cabin =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.75,
            .72,
            1.9
        ),
        new THREE.MeshStandardMaterial({
            color:0x101820,
            metalness:.3,
            roughness:.15
        })
    );

cabin.position.set(
    0,
    1.28,
    -.35
);

cabin.castShadow = true;

player.add(cabin);


/* windshield */

const windshield =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.55,
            .5,
            .05
        ),
        new THREE.MeshStandardMaterial({
            color:0x6ca7c9,
            transparent:true,
            opacity:.65
        })
    );

windshield.position.set(
    0,
    1.38,
    .63
);

windshield.rotation.x =
    -.25;

player.add(windshield);


/* =========================================================
   WHEELS
========================================================= */

const playerWheels = [];

function createWheel(
    x,
    z
){

    const wheel =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .43,
                .43,
                .34,
                20
            ),
            new THREE.MeshStandardMaterial({
                color:0x111111,
                roughness:.8
            })
        );

    wheel.rotation.z =
        Math.PI / 2;

    wheel.position.set(
        x,
        .43,
        z
    );

    wheel.castShadow = true;

    player.add(wheel);

    playerWheels.push(wheel);
}

createWheel(-1.18,-1.35);
createWheel(1.18,-1.35);
createWheel(-1.18,1.35);
createWheel(1.18,1.35);


/* =========================================================
   HEADLIGHTS
========================================================= */

function createLight(x){

    const light =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .35,
                .18,
                .08
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffdd,
                emissive:0xffffaa,
                emissiveIntensity:2
            })
        );

    light.position.set(
        x,
        .82,
        2.02
    );

    player.add(light);
}

createLight(-.7);
createLight(.7);


/* =========================================================
   WORLD OBJECTS
========================================================= */

const worldObjects = [];


/* TREE */

function createTree(
    x,
    z
){

    const tree =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25,
                .3,
                2,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x704214
            })
        );

    trunk.position.y = 1;

    tree.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.35,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x197536
            })
        );

    leaves.position.y = 2.7;

    leaves.castShadow = true;

    tree.add(leaves);


    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);

    worldObjects.push(tree);
}


/* BUILDING */

function createBuilding(
    x,
    z
){

    const building =
        new THREE.Group();

    const height =
        3 +
        Math.random()*5;

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3,
                height,
                3
            ),
            new THREE.MeshStandardMaterial({
                color:
                    0x555555 +
                    Math.floor(
                        Math.random()*0x333333
                    )
            })
        );

    mesh.position.y =
        height/2;

    mesh.castShadow = true;

    building.add(mesh);


    building.position.set(
        x,
        0,
        z
    );

    scene.add(building);

    worldObjects.push(building);
}


/* generate world */

for(
    let i=0;
    i<70;
    i++
){

    const z =
        -i*9 - 15;

    if(
        i % 3 === 0
    ){

        createBuilding(
            -11 -
            Math.random()*3,
            z
        );

        createBuilding(
            11 +
            Math.random()*3,
            z-4
        );

    }else{

        createTree(
            -10 -
            Math.random()*4,
            z
        );

        createTree(
            10 +
            Math.random()*4,
            z-4
        );
    }
}


/* =========================================================
   TRAFFIC
========================================================= */

const traffic = [];


function createTraffic(){

    const car =
        new THREE.Group();

    const colors = [
        0x1266d6,
        0xffc400,
        0xffffff,
        0x202020,
        0x8e44ad,
        0xff7a00
    ];

    const color =
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];


    const b =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.1,
                .65,
                3.8
            ),
            new THREE.MeshStandardMaterial({
                color:color,
                metalness:.3,
                roughness:.4
            })
        );

    b.position.y =
        .7;

    car.add(b);


    const top =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.65,
                .65,
                1.7
            ),
            new THREE.MeshStandardMaterial({
                color:0x17202a,
                roughness:.2
            })
        );

    top.position.set(
        0,
        1.25,
        -.25
    );

    car.add(top);


    for(
        const x of [-1.1,1.1]
    ){

        for(
            const z of [-1.25,1.25]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .4,
                        .4,
                        .3,
                        16
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x111111
                    })
                );

            wheel.rotation.z =
                Math.PI/2;

            wheel.position.set(
                x,
                .42,
                z
            );

            car.add(wheel);
        }
    }


    const lanes = [
        -4,
        -1.5,
        1.5,
        4
    ];

    car.position.set(
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ],
        0,
        -150 -
        Math.random()*100
    );

    car.userData.speed =
        15 +
        Math.random()*25;

    scene.add(car);

    traffic.push(car);
}


/* initial traffic */

for(
    let i=0;
    i<8;
    i++
){

    createTraffic();
}


/* =========================================================
   COINS
========================================================= */

const coins = [];


function createCoin(){

    const coin =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .38,
                .11,
                10,
                20
            ),
            new THREE.MeshStandardMaterial({
                color:0xffd21c,
                emissive:0x6b4500,
                emissiveIntensity:.6,
                metalness:.8
            })
        );

    const lanes = [
        -4,
        -1.5,
        1.5,
        4
    ];

    coin.position.set(
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ],
        1,
        -100 -
        Math.random()*160
    );

    coin.rotation.x =
        Math.PI/2;

    scene.add(coin);

    coins.push(coin);
}


for(
    let i=0;
    i<15;
    i++
){

    createCoin();
}


/* =========================================================
   GAME STATE
========================================================= */

let running = false;

let speed = 0;

let distance = 0;

let coinCount = 0;

let health = 100;

let nitro = 100;

let steering = 0;

let gas = false;

let brake = false;

let nitroActive = false;


/* =========================================================
   INPUT
========================================================= */

function holdButton(
    element,
    down,
    up
){

    element.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            down();
        }
    );

    element.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            up();
        }
    );

    element.addEventListener(
        "pointercancel",
        up
    );

    element.addEventListener(
        "pointerleave",
        up
    );
}


holdButton(
    document.getElementById("leftBtn"),
    ()=>{
        steering=-1;
    },
    ()=>{
        if(steering===-1)
            steering=0;
    }
);


holdButton(
    document.getElementById("rightBtn"),
    ()=>{
        steering=1;
    },
    ()=>{
        if(steering===1)
            steering=0;
    }
);


holdButton(
    document.getElementById("gasBtn"),
    ()=>{
        gas=true;
    },
    ()=>{
        gas=false;
    }
);


holdButton(
    document.getElementById("brakeBtn"),
    ()=>{
        brake=true;
    },
    ()=>{
        brake=false;
    }
);


holdButton(
    document.getElementById("nitroBtn"),
    ()=>{
        nitroActive=true;
    },
    ()=>{
        nitroActive=false;
    }
);


/* keyboard */

window.addEventListener(
    "keydown",
    e=>{

        if(e.key==="ArrowLeft")
            steering=-1;

        if(e.key==="ArrowRight")
            steering=1;

        if(e.key==="ArrowUp")
            gas=true;

        if(e.key==="ArrowDown")
            brake=true;

        if(
            e.key==="Shift" ||
            e.key===" "
        )
            nitroActive=true;
    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key==="ArrowRight"
        )
            steering=0;

        if(e.key==="ArrowUp")
            gas=false;

        if(e.key==="ArrowDown")
            brake=false;

        if(
            e.key==="Shift" ||
            e.key===" "
        )
            nitroActive=false;
    }
);


/* =========================================================
   COLLISION
========================================================= */

function hitTest(
    a,
    b,
    distanceLimit
){

    return (
        Math.abs(
            a.position.x -
            b.position.x
        ) < distanceLimit &&
        Math.abs(
            a.position.z -
            b.position.z
        ) < 3
    );
}


/* =========================================================
   DAMAGE
========================================================= */

function damage(){

    health -= 25;

    document
        .getElementById(
            "damageFlash"
        )
        .style.opacity = "1";

    setTimeout(
        ()=>{
            document
                .getElementById(
                    "damageFlash"
                )
                .style.opacity = "0";
        },
        120
    );

    if(
        health <= 0
    ){

        health = 0;

        endGame();
    }
}


/* =========================================================
   UPDATE HUD
========================================================= */

function updateHUD(){

    document
        .getElementById("distance")
        .textContent =
        Math.floor(distance);

    document
        .getElementById("coins")
        .textContent =
        coinCount;

    document
        .getElementById("speed")
        .textContent =
        Math.floor(speed);

    document
        .getElementById("healthFill")
        .style.width =
        health+"%";

    document
        .getElementById("nitroFill")
        .style.width =
        nitro+"%";
}


/* =========================================================
   UPDATE GAME
========================================================= */

function updateGame(delta){

    /* acceleration */

    if(gas){

        speed +=
            45*delta;

    }else{

        speed -=
            12*delta;
    }


    if(brake){

        speed -=
            70*delta;
    }


    /* nitro */

    if(
        nitroActive &&
        nitro>0 &&
        speed>10
    ){

        speed +=
            100*delta;

        nitro -=
            30*delta;

    }else{

        nitro +=
            7*delta;
    }


    nitro =
        THREE.MathUtils.clamp(
            nitro,
            0,
            100
        );


    speed =
        THREE.MathUtils.clamp(
            speed,
            0,
            nitroActive
            ? 220
            : 150
        );


    /* steering */

    player.position.x +=
        steering *
        (4 +
        speed*.025) *
        delta;


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -4.7,
            4.7
        );


    player.rotation.z =
        THREE.MathUtils.lerp(
            player.rotation.z,
            -steering*.12,
            .12
        );


    /* world speed */

    const worldSpeed =
        speed *
        delta *
        .13;


    /* road */

    for(
        const line of roadLines
    ){

        line.position.z +=
            worldSpeed;

        if(
            line.position.z > 15
        ){

            line.position.z -=
                800;
        }
    }


    /* environment */

    for(
        const obj of worldObjects
    ){

        obj.position.z +=
            worldSpeed;

        if(
            obj.position.z > 30
        ){

            obj.position.z -=
                650;
        }
    }


    /* traffic */

    for(
        const car of traffic
    ){

        car.position.z +=
            worldSpeed -
            car.userData.speed *
            delta *
            .08;

        if(
            car.position.z > 20
        ){

            car.position.z =
                -300 -
                Math.random()*120;

            const lanes = [
                -4,
                -1.5,
                1.5,
                4
            ];

            car.position.x =
                lanes[
                    Math.floor(
                        Math.random()*
                        lanes.length
                    )
                ];

            car.userData.speed =
                15 +
                Math.random()*35;
        }


        if(
            hitTest(
                player,
                car,
                2
            )
        ){

            damage();

            car.position.z =
                -250;

            speed *= .55;
        }
    }


    /* coins */

    for(
        const coin of coins
    ){

        coin.position.z +=
            worldSpeed;

        coin.rotation.y +=
            delta*4;

        if(
            coin.position.z > 20
        ){

            coin.position.z =
                -180 -
                Math.random()*150;

            const lanes = [
                -4,
                -1.5,
                1.5,
                4
            ];

            coin.position.x =
                lanes[
                    Math.floor(
                        Math.random()*
                        lanes.length
                    )
                ];
        }


        if(
            hitTest(
                player,
                coin,
                1.5
            )
        ){

            coinCount++;

            coin.position.z =
                -180 -
                Math.random()*150;
        }
    }


    /* distance */

    distance +=
        speed *
        delta /
        3.6;


    /* wheels */

    for(
        const wheel of playerWheels
    ){

        wheel.rotation.x -=
            speed *
            delta *
            .12;
    }


    updateHUD();
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const targetX =
        player.position.x*.45;

    camera.position.x =
        THREE.MathUtils.lerp(
            camera.position.x,
            targetX,
            .08
        );

    camera.position.y =
        5.5;

    camera.position.z =
        11;

    camera.lookAt(
        player.position.x,
        .8,
        -8
    );
}


/* =========================================================
   START
========================================================= */

function startGame(){

    running = true;

    speed = 0;

    distance = 0;

    coinCount = 0;

    health = 100;

    nitro = 100;

    player.position.x = 0;

    document
        .getElementById(
            "startScreen"
        )
        .style.display = "none";

    document
        .getElementById(
            "gameOver"
        )
        .style.display = "none";

    updateHUD();
}


document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        startGame
    );


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    if(!running)
        return;

    running = false;

    const oldBest =
        Number(
            localStorage.getItem(
                "bestDistance"
            ) || 0
        );

    const best =
        Math.max(
            oldBest,
            Math.floor(distance)
        );

    localStorage.setItem(
        "bestDistance",
        best
    );

    document
        .getElementById(
            "finalDistance"
        )
        .textContent =
        Math.floor(distance)+" m";

    document
        .getElementById(
            "finalCoins"
        )
        .textContent =
        coinCount;

    document
        .getElementById(
            "bestDistance"
        )
        .textContent =
        best+" m";

    document
        .getElementById(
            "gameOver"
        )
        .style.display = "flex";
}


document
    .getElementById(
        "restartButton"
    )
    .addEventListener(
        "click",
        startGame
    );


/* =========================================================
   LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(running){

        updateGame(delta);
    }


    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
